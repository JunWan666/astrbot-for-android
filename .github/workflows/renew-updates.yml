name: Renew update catalogs
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-update-catalogs
  cancel-in-progress: false
jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: updates
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography
      - run: python -B tools/renew_update_catalogs.py
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      - name: Publish renewed metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stable/*.json
          number=$(printf '%03d' "$(( $(git rev-list --count HEAD) + 1 ))")
          git commit -m "${number}:更新:续期组件与管理器更新目录"
          git push origin HEAD:updates
