name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check build script syntax
        run: python -B -c "import ast; from pathlib import Path; [ast.parse(p.read_text(encoding='utf8'), filename=str(p)) for p in Path('tools').rglob('*.py')]"
      - name: Compile application sources
        run: bash gradlew :core:compileKotlin :app:compileBootstrapReleaseKotlin
